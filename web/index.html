<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد العربي — Qwen3-1.7B</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(15,23,42,0.9);
    border-bottom: 1px solid #334155;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 40px; height: 40px;
    background: #6366f1; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  h1 { font-size: 17px; font-weight: 700; }
  .sub { font-size: 12px; color: #94a3b8; }
  .badge {
    margin-right: auto;
    background: #0f766e; color: #99f6e4;
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
  }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 80%; padding: 12px 16px; border-radius: 16px;
    font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word;
  }
  .user {
    align-self: flex-start;
    background: #6366f1; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-end;
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155;
    border-bottom-left-radius: 4px;
  }
  .thinking {
    font-size: 12px; color: #64748b;
    border-right: 3px solid #475569;
    padding: 6px 10px; margin-bottom: 8px;
    white-space: pre-wrap;
  }
  .typing {
    align-self: flex-end;
    display: flex; gap: 5px; padding: 14px 18px;
    background: #1e293b; border-radius: 16px; border: 1px solid #334155;
  }
  .dot { width: 8px; height: 8px; background: #64748b; border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0);} 30% { transform: translateY(-6px);} }
  .input-row {
    padding: 14px 20px;
    background: rgba(15,23,42,0.9);
    border-top: 1px solid #334155;
    display: flex; gap: 10px;
  }
  textarea {
    flex: 1; resize: none;
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 12px;
    padding: 12px; font-size: 14.5px; font-family: inherit;
    outline: none; min-height: 46px; max-height: 120px;
  }
  textarea:focus { border-color: #6366f1; }
  button {
    background: #6366f1; color: #fff; border: none;
    border-radius: 12px; padding: 0 22px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #334155; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <div>
    <h1>المساعد العربي</h1>
    <div class="sub">Qwen3-1.7B — يعمل محليًا على جهازك</div>
  </div>
  <span class="badge">● متصل</span>
</header>

<div id="chat">
  <div class="msg bot">مرحبًا! أنا مساعد عربي يعمل محليًا على جهازك. اسألني عن أي شيء بالعربية 🇩🇿</div>
</div>

<div class="input-row">
  <textarea id="input" placeholder="اكتب سؤالك بالعربية هنا..." rows="1"></textarea>
  <button id="send">إرسال</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  const typing = showTyping();
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: text }],
        max_tokens: 256,
        temperature: 0.7
      })
    });
    const data = await res.json();
    typing.remove();
    const msg = data.choices[0].message;
    const botDiv = addMsg('bot', msg.content || '(لا يوجد رد — حاول صياغة السؤال بشكل أبسط)');
    if (msg.reasoning_content) {
      const t = document.createElement('div');
      t.className = 'thinking';
      t.textContent = '💭 تفكير: ' + msg.reasoning_content.slice(0, 300) + (msg.reasoning_content.length > 300 ? '...' : '');
      botDiv.prepend(t);
    }
  } catch (e) {
    typing.remove();
    addMsg('bot', '⚠️ تعذر الاتصال بالخادم: ' + e.message);
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
